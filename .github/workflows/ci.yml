name: CI

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Dummy values to satisfy pydantic Settings() at module-import time.
    # CI does not connect to any DB or external service — the tests below
    # are pure Python or FastAPI in-memory. These are NEVER used as real
    # credentials anywhere; they only exist so `Settings()` constructs.
    env:
      DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci"
      SECRET_KEY: "ci-test-secret-not-used-anywhere-real"
      ADMIN_USERNAME: "ci"
      ADMIN_PASSWORD_HASH: "$2b$12$ciCIRequiredAtImportTimeButNeverActuallyVerified."

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies (skip heavy ML packages)
        run: |
          pip install --quiet \
            fastapi uvicorn pydantic-settings \
            'sqlalchemy[asyncio]' asyncpg psycopg2-binary alembic \
            celery redis \
            python-jose bcrypt 'google-auth[requests]' \
            python-multipart email-validator \
            slowapi itsdangerous sqladmin \
            anthropic \
            pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          pytest tests/parsers/ \
                 tests/analyzers/test_temporal.py \
                 tests/analyzers/test_narrative.py \
                 tests/analyzers/test_conflict.py \
                 tests/analyzers/test_redaction.py \
                 tests/analyzers/test_sentiment_llm.py \
                 tests/analyzers/lexicons/ \
                 tests/services/ \
                 -v
        # Sentiment tests excluded — require torch (~2 GB), tested locally.
        # Lexicon scorer tests included: pure stdlib, no ML deps.
